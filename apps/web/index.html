<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/polaris-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极星仓储</title>
    <style>
      html { background: #f4f7fb; color: #102033; color-scheme: light; }
      html[data-theme='dark'] { background: #0b1220; color: #f3f7fb; color-scheme: dark; }
    </style>
    <script>
      (() => {
        const stored = localStorage.getItem('wms-theme')
        const preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        const root = document.documentElement
        root.dataset.theme = theme
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
